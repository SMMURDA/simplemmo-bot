name: rebuild
on:
  push:
    paths:
      - .github/workflows/rebuild.yml
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "paean-bot"
          git config user.email "ask@topup.eu.org"
          git rm -q .github/workflows/rebuild.yml
          git commit -m "chore(ci): hapus workflow rebuild sementara"
          git push
