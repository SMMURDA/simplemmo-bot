name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Bundel .min.js di-commit dan langsung dilayani ke pengunjung, jadi
      # bundel yang basi terhadap sumbernya berarti situs menjalankan kode lama
      # tanpa ada yang sadar. Langkah ini hanya MEMERIKSA (tidak menulis apa
      # pun): kalau ada yang basi, deploy dihentikan dan produksi tetap memakai
      # versi terakhir yang sudah benar, bukan versi yang salah.
      - name: Pastikan bundel .min.js sinkron dengan sumbernya
        run: |
          npm ci --no-audit --no-fund
          npm run check:js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build website with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages

    steps:
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4