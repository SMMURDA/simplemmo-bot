name: fix-mail
on:
  push:
    paths:
      - .github/workflows/fix-mail.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite contact address in index.html
        run: |
          echo "sebelum: $(grep -c 'ask@askstore\.eu\.org' index.html || true)"
          sed -i 's/ask@askstore\.eu\.org/ask@topup.eu.org/g' index.html
          echo "sesudah: $(grep -c 'ask@askstore' index.html || true)"
          test "$(grep -c 'ask@askstore' index.html || true)" = "0"
      - name: Commit and remove this workflow
        run: |
          git config user.name "paean-bot"
          git config user.email "ask@topup.eu.org"
          git rm -q .github/workflows/fix-mail.yml
          git add index.html
          git commit -m "fix(site): kontak pembelian ke ask@topup.eu.org [skip ci]"
          git push
