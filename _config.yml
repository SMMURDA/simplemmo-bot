title: TOPUP AUTOMOTION
description: Game automation tools with Telegram, Terminal, and Web control.

url: "https://topup.eu.org"
baseurl: ""

lang: en_US

author:
  name: Mustofa Bovalone

telegram_url: https://t.me/bovalone
instagram_url: https://instagram.com/bovalonee
license_server_url: https://license.topup.eu.org

markdown: kramdown
highlighter: rouge
permalink: pretty

# jekyll-seo-tag is deliberately absent: it emitted a second og:*/twitter:*
# set next to the explicit block in _layouts/default.html, and its small
# "summary" twitter:card won over the intended summary_large_image. Title,
# description and canonical are written out in the layout instead.
plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - LICENSE
  - .gitignore
  - vendor
  - Gemfile
  - Gemfile.lock

defaults:
  - scope:
      path: ""
    values:
      layout: default