<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-in page moved - TOPUP AUTOMOTION</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://topup.eu.org/login/">
<script>
  /* Server OAuth mengirim pengguna ke /trial/?login=... dan /trial/?auth_error=...
     Skrip ini berjalan sebelum meta refresh di bawah, jadi parameter dan hash
     diteruskan apa adanya ke halaman baru dan konteksnya tidak hilang. Tanpa
     JavaScript, meta refresh tetap membawa pengunjung ke halaman yang benar. */
  location.replace('/login/' + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=/login/">
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         font:16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
         background:#FAF7FF; color:#241D33; text-align:center; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { margin:0; color:#6B6288; }
  a { color:#B7309E; }
  @media (prefers-color-scheme: dark) {
    body { background:#0B0A12; color:#F5F3FF; }
    p { color:#A79FC0; }
    a { color:#FC84FC; }
  }
</style>
</head>
<body>
<main>
  <h1>This page has moved</h1>
  <p>The sign-in page is now at <a href="/login/">topup.eu.org/login/</a>.</p>
</main>
</body>
</html>
