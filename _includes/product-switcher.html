{%- assign current_url = page.url | remove: 'index.html' -%}
{%- assign is_vhack = current_url contains '/vhack/' -%}
<nav class="product-switcher" aria-label="Product documentation selector">
  <div class="product-switcher__inner">
    <span class="product-switcher__label">Docs</span>
    <div class="product-switcher__tabs" role="tablist">
      <a class="ps-tab {% unless is_vhack %}ps-tab--on{% endunless %}"
         href="{{ include.simplemmo_href | default: '/getting-started/' }}"
         role="tab"
         {% unless is_vhack %}aria-selected="true"{% endunless %}>
        <span class="ps-tab__dot" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14c3.4-6.4 7.8-8.7 15-9-1.1 7.3-4.2 12.2-11 14l-1.5-3.2L4 14Z"/><path d="m8.3 14.2 4.8-4.8"/></svg>
        SimpleMMO Bot
      </a>
      <a class="ps-tab {% if is_vhack %}ps-tab--on{% endif %}"
         href="{{ include.vhack_href | default: '/vhack/getting-started/' }}"
         role="tab"
         {% if is_vhack %}aria-selected="true"{% endif %}>
        <span class="ps-tab__dot" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 3 5 14h7l-1 7 8-11h-7l1-7Z"/><path d="M3 6h5M2 10h4"/></svg>
        VHack Revolution
      </a>
    </div>
  </div>
</nav>
<style>
.product-switcher{border-bottom:1px solid rgba(112,221,240,.18);background:#151a25;margin:0 -9999px;padding:0 9999px}
.product-switcher__inner{max-width:1120px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.product-switcher__label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:#5a6478;white-space:nowrap}
.product-switcher__tabs{display:flex;gap:10px}

/* ── Tab base (inactive) ── */
.ps-tab{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:10px;font-size:.85rem;font-weight:550;color:#6b7a90;text-decoration:none;border:2px solid #1e2736;background:#111824;transition:all .2s ease;cursor:pointer;user-select:none}
.ps-tab:hover{color:#c0ccdc;border-color:#2a3650;background:#182130}
.ps-tab svg{opacity:.4;transition:opacity .2s}

/* ── Tab active ── */
.ps-tab--on{color:#ffffff;font-weight:700;background:linear-gradient(135deg,#0e2a3a 0%,#0a1f2e 100%);border-color:#46d9ed;box-shadow:0 0 20px rgba(70,217,237,.18),0 0 6px rgba(70,217,237,.10),inset 0 1px 0 rgba(70,217,237,.08)}
.ps-tab--on svg{opacity:1;stroke:#46d9ed}
.ps-tab--on:hover{border-color:#46d9ed;color:#ffffff}

/* ── Dot indicator ── */
.ps-tab__dot{width:9px;height:9px;border-radius:50%;background:#2a3650;transition:all .3s ease;flex-shrink:0}
.ps-tab--on .ps-tab__dot{background:#46d9ed;box-shadow:0 0 10px #46d9ed,0 0 4px #46d9ed;animation:ps-glow 2s ease-in-out infinite}
@keyframes ps-glow{0%,100%{box-shadow:0 0 10px #46d9ed,0 0 4px #46d9ed;transform:scale(1)}50%{box-shadow:0 0 18px #46d9ed,0 0 8px #46d9ed;transform:scale(1.15)}}

/* ── Mobile ── */
@media(max-width:520px){
  .product-switcher__label{display:none}
  .product-switcher__inner{padding:12px 16px}
  .ps-tab{padding:8px 14px;font-size:.8rem;gap:6px}
  .ps-tab__dot{width:7px;height:7px}
}
</style>
