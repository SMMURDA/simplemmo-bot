{%- assign active_product = page.product | default: 'smmo' -%}
<nav class="product-switcher" data-active="{{ active_product }}" aria-label="Product documentation selector">
  <div class="product-switcher__inner">
    <span class="product-switcher__label">Docs</span>
    <div class="product-switcher__tabs">
      <a class="ps-tab" data-product="smmo"
         href="{{ include.simplemmo_href | default: '/smmo/getting-started/' }}">
        <span class="ps-tab__dot"></span>
        <img src="/assets/images/simplemmo-logo.png" alt="" width="18" height="18" style="border-radius:3px;object-fit:cover;image-rendering:-webkit-optimize-contrast">
        <span>SimpleMMO Bot</span>
      </a>
      <a class="ps-tab" data-product="vhack"
         href="{{ include.vhack_href | default: '/vhack/getting-started/' }}">
        <span class="ps-tab__dot"></span>
        <img src="/assets/images/vhack-logo.png" alt="" width="18" height="18" style="border-radius:3px;object-fit:cover;image-rendering:-webkit-optimize-contrast">
        <span>vHack Revolutions</span>
      </a>
    </div>
  </div>
</nav>
<style>
.product-switcher{background:var(--surface,#151a25);border:1px solid rgba(112,221,240,.14);border-radius:12px;padding:14px 20px;margin:0 0 28px}
.product-switcher__inner{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.product-switcher__label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#5a6478;white-space:nowrap}
.product-switcher__tabs{display:flex;gap:8px}
.ps-tab{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:10px;font-size:.85rem;font-weight:550;color:#556178;text-decoration:none;border:2px solid #1c2535;background:#0f1520;transition:all .2s ease;cursor:pointer}
.ps-tab:hover{color:#9aabc2;border-color:#283548;background:#141d2c}
.ps-tab svg,.ps-tab img{opacity:.35;transition:opacity .2s}
.ps-tab__dot{width:9px;height:9px;border-radius:50%;background:#1c2535;flex-shrink:0;transition:all .3s ease}
.ps-tab.ps-on{color:#fff !important;font-weight:700;background:#0c2233 !important;border-color:#46d9ed !important;box-shadow:0 0 24px rgba(70,217,237,.20),0 0 8px rgba(70,217,237,.12)}
.ps-tab.ps-on:hover{color:#fff;border-color:#46d9ed}
.ps-tab.ps-on svg{opacity:1;stroke:#46d9ed}
.ps-tab.ps-on img{opacity:1}
.ps-tab.ps-on .ps-tab__dot{background:#46d9ed;box-shadow:0 0 12px #46d9ed,0 0 5px #46d9ed;animation:ps-dot-pulse 2s ease-in-out infinite}
@keyframes ps-dot-pulse{0%,100%{box-shadow:0 0 12px #46d9ed,0 0 5px #46d9ed;transform:scale(1)}50%{box-shadow:0 0 20px #46d9ed,0 0 10px #46d9ed;transform:scale(1.2)}}
@media(max-width:520px){.product-switcher__label{display:none}.product-switcher{padding:12px 14px}.ps-tab{padding:8px 14px;font-size:.8rem;gap:6px}.ps-tab__dot{width:7px;height:7px}}
</style>
