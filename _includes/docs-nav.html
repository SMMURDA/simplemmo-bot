<!--
  Documentation table of contents.

  Two wrappers around one shared list (docs-nav-links.html), because the two
  breakpoints need different behaviour and CSS cannot close a <details>:

    - Narrow screens get a <details> that starts closed, so the article is
      what the reader sees first instead of ~740px of contents.
    - Wide screens get a plain always-visible list. Keeping it expanded is the
      point of the feature: the docs had no navigation at all before, and a
      contents list hidden behind a click would put readers back where they
      started.

  Only one of the two is ever displayed, so nothing is announced twice to a
  screen reader. Both are plain HTML apart from the shared include, so neither
  can fail the Jekyll build.
-->
<details class="docs-nav docs-nav--mobile">
  <summary class="docs-nav__summary">Contents</summary>
  <nav class="docs-nav__body" aria-label="Documentation contents">
    {% include docs-nav-links.html %}
  </nav>
</details>

<nav class="docs-nav docs-nav--desktop" aria-label="Documentation contents">
  {% include docs-nav-links.html %}
</nav>
