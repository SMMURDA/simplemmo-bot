---
layout: default
title: Email Verification
permalink: /accounts/verify/
account_section: verify
noindex: true
sitemap: false
---
<div class="portal" data-member-portal data-page="verify">
  <main class="portal-main">
    <p class="eyebrow">Account setup</p><h1>Email verification</h1>
    <section id="verify-card" style="max-width:480px;margin-top:20px;padding:24px;border:1px solid var(--border,#334155);border-radius:12px;background:var(--surface,#1e293b)">
      <h3 style="margin:0 0 8px">Verify your email</h3>
      <p style="font-size:13px;color:var(--muted,#94a3b8);margin:0 0 16px">Only @gmail.com addresses are accepted. A 6-digit code will be sent to your email.</p>
      <input id="verify-email" type="email" placeholder="yourname@gmail.com" style="width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--border,#334155);background:var(--card,#0f172a);color:inherit;margin-bottom:12px;font-size:16px;box-sizing:border-box">
      <button id="verify-send-otp" class="button button--primary" type="button" style="width:100%">Send verification code</button>
      <div id="verify-otp-section" hidden style="margin-top:16px">
        <input id="verify-otp-input" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit code" style="width:100%;padding:14px;border-radius:8px;border:1px solid var(--border,#334155);background:var(--card,#0f172a);color:inherit;font-size:22px;letter-spacing:8px;text-align:center;box-sizing:border-box;margin-bottom:12px">
        <div id="turnstile-container" style="display:flex;justify-content:center;margin:8px 0 12px;"></div>
        <button id="verify-confirm" class="btn btn--primary" type="button" style="width:100%">Verify code</button>
      </div>
      <p id="verify-status" style="font-size:13px;margin:10px 0 0"></p>
    </section>
    <div id="portal-status" class="portal-status" aria-live="polite"></div>
  </main>
</div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=_verifyInitTurnstile" async defer></script>
<script>
window._verifyInitTurnstile=function(){
  var container=document.getElementById('turnstile-container');
  if(!container)return;
  turnstile.render(container,{sitekey:'0x4AAAAAckVdV5Afl0gR2b',theme:'dark',callback:function(token){window._turnstileToken=token;}});
};
</script>
<script src="{{ '/assets/js/portal-common.min.js?v=20260820-2' | relative_url }}" defer></script>
<script src="{{ '/assets/js/verify.js?v=20260816-4' | relative_url }}" defer></script>
